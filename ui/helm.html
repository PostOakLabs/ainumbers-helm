<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Helm</title>
  <link rel="stylesheet" href="theme.css" />
</head>
<body>
  <header class="shell-header">
    <span class="wordmark">Helm</span>
    <nav class="shell-nav" aria-label="Primary">
      <div role="group" aria-label="Build" data-group="build">
        <a href="#/choose" data-view="choose">Choose</a>
        <a href="#/canvas" data-view="canvas">Canvas</a>
        <a href="#/connect" data-view="connect">Connect</a>
      </div>
      <div role="group" aria-label="Execute" data-group="execute">
        <a href="#/run" data-view="run">Run</a>
        <a href="#/verify" data-view="verify">Verify</a>
        <a href="#/review" data-view="review">Review</a>
      </div>
      <div role="group" aria-label="Operate" data-group="operate">
        <a href="#/operate" data-view="operate">Operate</a>
        <a href="#/register" data-view="register">Register</a>
        <a href="#/help" data-view="help">Help</a>
      </div>
    </nav>
    <span class="status-pill">
      <span id="status-dot" class="status-dot" data-state="dormant" aria-hidden="true"></span>
      <span id="status-label" role="status">not paired</span>
      <button id="density-toggle" class="secondary" type="button" aria-pressed="false">Comfortable</button>
      <button id="unpair-btn" class="secondary" type="button">Unpair</button>
    </span>
  </header>
  <div id="version-skew-banner-slot"></div>
  <div id="durability-banner-slot"></div>
  <main id="shell-main" class="shell-main" aria-live="polite"></main>
  <script type="module" src="app.mjs"></script>
</body>
</html>
