<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Helm</title>
  <link rel="stylesheet" href="theme.css" />
</head>
<body>
  <header class="shell-header">
    <a class="wordmark" href="#/home">Helm</a>
    <span class="beta-badge" title="Helm is in beta: expect rough edges in the interface. The evidence and verification math underneath is the tested core.">Beta</span>
    <!-- HELM-UX2-B-TABMETA (§12): generated by app.mjs's generateNav() from
         ui/lib/tab-meta.mjs TABS — the markup shape (role="group" +
         aria-label + data-group per stage) stays load-bearing for
         theme.css's HELM-UX-1 §6.2/§6.3 separator rule; do not hand-edit. -->
    <nav class="shell-nav" aria-label="Primary"></nav>
    <span class="status-pill">
      <span id="status-dot" class="status-dot" data-state="dormant" aria-hidden="true"></span>
      <span id="status-label" role="status">not paired</span>
      <button id="unpair-btn" class="secondary" type="button">Unpair</button>
    </span>
  </header>
  <!-- §14.5: siblings that can both fill, capped at two — skew first (it's
       the more urgent "you're on stale software" notice), durability second. -->
  <div id="banner-stack">
    <div id="version-skew-banner-slot"></div>
    <div id="durability-banner-slot"></div>
  </div>
  <main id="shell-main" class="shell-main" aria-live="polite">
    <div id="view-header"></div>
    <div id="view-content"></div>
  </main>
  <script type="module" src="app.mjs"></script>
</body>
</html>
