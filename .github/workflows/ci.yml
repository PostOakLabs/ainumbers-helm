name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: hook↔CI parity (no gate drift)
        run: node scripts/check-hook-ci-parity.mjs
      - name: internal-lang leak (INTERNAL-LANG-LEAK-1)
        run: node scripts/check-internal-lang-leak.mjs
      - name: copy hallmarks (AI-writing-tell gate)
        run: node scripts/check-copy-hallmarks.mjs
      - name: lint
        run: node scripts/lint.mjs
      - name: agent kit regeneration gate (byte-compare + schema + verb checks)
        run: node scripts/check-agent-kit.mjs
      # Install a real Secret Service so the linux-secret-tool vault tier is
      # genuinely reachable in CI, not just warned about. Without this the
      # ubuntu runner has no Secret Service daemon, vaultSet's
      # linux-secret-tool attempt throws, and every secret silently lands on
      # the file-fallback tier instead.
      - name: install Secret Service (libsecret + gnome-keyring) for real linux-secret-tool coverage
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gnome-keyring libsecret-tools dbus-x11
      # Env vars land in $GITHUB_ENV (not just this step's shell) so the plain
      # `node scripts/test.mjs` invocation below stays a single literal line —
      # check-hook-ci-parity.mjs greps exactly that shape, and burying it
      # inside a `bash -c '...'` wrapper would make this gate invisible to it.
      - name: start + unlock a Secret Service session (dbus + gnome-keyring)
        run: |
          eval "$(dbus-launch --sh-syntax)"
          echo "DBUS_SESSION_BUS_ADDRESS=$DBUS_SESSION_BUS_ADDRESS" >> "$GITHUB_ENV"
          eval "$(printf '\n' | gnome-keyring-daemon --unlock --components=secrets)"
          echo "GNOME_KEYRING_CONTROL=$GNOME_KEYRING_CONTROL" >> "$GITHUB_ENV"
      - name: test
        run: node scripts/test.mjs
      - name: validate control-plane schemas
        run: node scripts/validate-schemas.mjs
      # server.json (the MCP Registry listing) is validated by TWO
      # independent gates — they catch different defect classes, and the
      # second exists because of a measured hole in the first.
      #
      # Gate 1: `mcp-publisher validate` — the registry project's own
      # validation tool. Deliberately NOT a GitHub Action: a pinned binary
      # download needs no new-action review. It is downloaded from the
      # release the upstream project publishes and verified against that
      # release's own checksums file (registry_1.7.9_checksums.txt,
      # sigstore-attested upstream) before it may run. v1.7.9 is the exact
      # version used to validate this file at review time; the next
      # upstream release (v1.8.1) measured identically.
      #
      # Measured hole: mcp-publisher 1.7.9 AND 1.8.1 both report a
      # packages[] entry with registryType "github" as VALID — no published
      # server.schema.json versions registryType as a hard enum
      # (description/examples only), yet registry consumers resolve only
      # npm | pypi | oci | nuget | mcpb. That hole is how an invalid
      # "github" entry survived a green validate. Gate 2 exists for exactly
      # that class.
      - name: MCP Registry server.json — mcp-publisher validate (pinned binary)
        run: |
          curl -sS -L --fail -o /tmp/mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/v1.7.9/mcp-publisher_linux_amd64.tar.gz"
          echo "ab128162b0616090b47cf245afe0a23f3ef08936fdce19074f5ba0a4469281ac  /tmp/mcp-publisher.tar.gz" | sha256sum -c -
          mkdir -p /tmp/mcp-publisher-bin
          tar -xzf /tmp/mcp-publisher.tar.gz -C /tmp/mcp-publisher-bin
          /tmp/mcp-publisher-bin/mcp-publisher validate server.json
      # Gate 2: registry-consumer policy — the constraints the official
      # schema leaves open, made mechanical: registryType in the
      # registry-documented set, mcpb identifier == the release asset the
      # release workflow's mcpb job attaches, versions consistent, and the
      # row's ⛔ no-remote-endpoints fence (loopback transport, remotes
      # [], loopback stated in the description).
      - name: MCP Registry server.json — registry-consumer policy gate
        run: node scripts/check-server-json.mjs
      - name: verify vendored OCG integrity
        run: node scripts/verify-vendored.mjs
      - name: credits registry coverage (vendored-code license gate)
        run: node scripts/check-credits-coverage.mjs helm
      - name: credits notices freshness (generated from registry)
        run: node scripts/gen-credits.mjs helm --check
      - name: compile parity gate (HELM-P2-C2)
        run: node scripts/compile-parity-gate.mjs
      # Fails when a file the technical design doc cites has changed, gone
      # missing, or shrunk past a cited line, since the last time a human
      # re-read the doc's claims against that code. The re-stamp is
      # deliberately NOT run here: see the header of the gate.
      - name: techdoc citation drift
        run: node scripts/check-techdoc-citations.mjs
      - name: sea build dry-run
        run: node scripts/sea-dry-run.mjs

  # macOS Keychain (`security` CLI) is only genuinely reachable on a darwin
  # runner — a lightweight second job just for the test suite is enough to
  # exercise that tier for real in CI rather than only on a developer's Mac.
  # macos-latest ships an unlocked default login keychain, so no
  # daemon-unlock step is needed here.
  ci-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: test
        run: node scripts/test.mjs

  # Cross-OS pairing e2e: checks that a fresh helmd boot pairs correctly on
  # every OS we ship to, not just Linux — GitHub-hosted runners are free for
  # this public repo, so this needs no extra hardware. Boots the real
  # hub/server.mjs headless (no subprocess, same pattern as server.test.mjs /
  # ci-macos above) and replays the pairing bootstrap with the REAL
  # ui/api.mjs hash parsers on each OS — see hub/pairing-e2e.test.mjs. No new
  # third-party action: only the two already-pinned actions above + `run:`.
  xos-e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: pairing e2e (OS-matrix)
        run: node --test hub/pairing-e2e.test.mjs

  # Live third-party coverage (FreeTSA / OTS) moved OUT of this PR-triggered
  # workflow into live-net.yml (scheduled + manual dispatch). It was
  # continue-on-error here, so a FreeTSA/OTS outage never blocked a PR — but it
  # still painted a cosmetic red ✗ on every PR whenever the third party flaked
  # (e.g. run 30123879153 on the docs-only PR #86). Running it on a schedule
  # keeps the live coverage while keeping that flakiness off PR checks entirely.
