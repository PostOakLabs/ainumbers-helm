name: Release absence gate

# Two independent absence signals, on one schedule
# (HELM-RELEASE-TRIGGER-BUILD-SPEC.md §2.1):
#   check  — a GA CalVer tag with no published release
#   feed   — https://ainumbers.co/helm/version.json behind the newest GA tag
#
# They are separate JOBS, not steps in one job, on purpose: each must be able to
# fail without the other masking it. A step-level failure would stop the job and
# hide whichever check ran second, and these two conditions have genuinely
# independent causes — the release publishes via release.yml's own token, the
# feed publishes from a SEPARATE job with a SEPARATE token
# (SITE_REPO_PUSH_TOKEN) into the site repo. A release can ship completely while
# the feed every running helmd actually reads stays stale, and vice versa.
#
# The feed job does not re-implement the tag check: it imports the tag listing
# and the CalVer definition from scripts/check-release-absence.mjs, so the two
# gates cannot drift apart about what counts as a tag.
#
# Catches a tag that never got a release — the exact failure release.yml
# itself cannot see, because a
# GITHUB_TOKEN-authored push (auto-tag-release.yml) never fires a
# tag-triggered workflow (documented GitHub behavior). release.yml has
# not run since 2026-07-25 while auto-tag-release.yml kept tagging
# daily, and every existing signal (auto-tag's own green run, the tag's
# existence) stayed green throughout.
#
# Runs on its OWN clock — never inside release.yml — so it can detect
# release.yml not running at all. Needs no secret: tags and releases are
# both readable with the default GITHUB_TOKEN's read scope.
#
# Own silent-failure mode (see scripts/check-release-absence.mjs header):
# GitHub disables a scheduled workflow after 60 days with zero repo
# activity. This repo's daily auto-tag-release.yml push is expected to
# keep resetting that clock; there is no secondary watchdog for this
# gate itself — stated, not solved.
on:
  schedule:
    - cron: "30 14 * * *" # once daily, after auto-tag-release's 14:00 UTC run
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
      - name: tag-vs-release completeness
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-release-absence.mjs

  # Separate job so a stale feed is visible even when `check` is red, and so a
  # tagless tag is visible even when the feed is fine. Same schedule, same
  # read-only token, same surface — no new dependency.
  feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
      - name: live version feed not behind newest GA tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-version-feed-staleness.mjs
