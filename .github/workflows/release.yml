name: Release

# HELM-H8: tag-triggered three-platform SEA build + signed release manifest
# + packaging manifests, published as a GitHub pre-release. Never runs on
# push to main — only on an explicit CalVer tag, so cutting a release is a
# deliberate act (git tag + push), not a side effect of merging.
#
# HELM-CALVER-1: version IS the ship date — YYYY.M.D, no zero-padding, no
# `v` prefix (Tim, 2026-07-25: "the tagging system is dumb ... it's
# arbitrary"). Tag with: git tag 2026.7.25 && git push --tags.
#
# HELM-REGISTRY-LIST-1: a workflow_dispatch surface exists ONLY for the
# .mcpb bundle job (dry-run validation of the new step on a branch, and
# backfilling the bundle onto a release that predates it). It is
# side-effect-free by default (dry_run: true). A real release still comes
# ONLY from an explicit CalVer tag push — on tag pushes the inputs context
# is empty and every job behaves exactly as before this trigger existed.
on:
  push:
    tags:
      - "20[0-9][0-9].*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to (re)build the .mcpb for (e.g. 2026.9.13); empty = the dispatching ref"
        type: string
        required: false
        default: ""
      dry_run:
        description: "Build + print the bundle sha256 only; skip the release upload"
        type: boolean
        required: false
        default: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: lint
        run: node scripts/lint.mjs
      # Install a real Secret Service so the linux-secret-tool vault tier is
      # genuinely reachable in CI, not just warned about. Without this the
      # ubuntu runner has no Secret Service daemon, vaultSet's
      # linux-secret-tool attempt throws, and every secret silently lands on
      # the file-fallback tier instead.
      - name: install Secret Service (libsecret + gnome-keyring) for real linux-secret-tool coverage
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gnome-keyring libsecret-tools dbus-x11
      # Env vars land in $GITHUB_ENV (not just this step's shell) so the plain
      # `node scripts/test.mjs` invocation below stays a single literal line —
      # check-hook-ci-parity.mjs greps exactly that shape, and burying it
      # inside a `bash -c '...'` wrapper would make this gate invisible to it.
      - name: start + unlock a Secret Service session (dbus + gnome-keyring)
        run: |
          eval "$(dbus-launch --sh-syntax)"
          echo "DBUS_SESSION_BUS_ADDRESS=$DBUS_SESSION_BUS_ADDRESS" >> "$GITHUB_ENV"
          eval "$(printf '\n' | gnome-keyring-daemon --unlock --components=secrets)"
          echo "GNOME_KEYRING_CONTROL=$GNOME_KEYRING_CONTROL" >> "$GITHUB_ENV"
      - name: test
        run: node scripts/test.mjs
      - name: validate control-plane schemas
        run: node scripts/validate-schemas.mjs
      - name: sea build dry-run
        run: node scripts/sea-dry-run.mjs

  build:
    needs: test
    # Dispatch runs are the .mcpb dry-run/backfill surface (see `on:`) —
    # they exercise the test job + the mcpb job only. Gating the SEA build
    # HERE cascades the skip everywhere else: sign-and-release and sbom skip
    # via needs, attach-sbom-asset via needs, and publish-npm /
    # publish-version-feed via the empty is_ga output — so a dispatch can
    # never reach release creation, npm publish, or the site-repo feed push.
    if: github.event_name == 'push'
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            tag: linux-x64
          - os: windows-latest
            tag: windows-x64
          # macos-13 (Intel) was retired by GitHub 2025-12-04; macos-15-intel
          # is the current Intel image (supported through Aug 2027).
          - os: macos-15-intel
            tag: macos-x64
          - os: macos-14
            tag: macos-arm64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      # Stamp package.json's version to the EXACT tag string (including any
      # -rc suffix) before build-sea.mjs embeds it, so the binary and the
      # eventual signed manifest both carry the real tag — never a
      # committed placeholder.
      - name: stamp package.json version from tag
        shell: bash
        run: |
          node -e "
            const fs = require('node:fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = process.env.GITHUB_REF_NAME;
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "
      - name: build SEA binary (${{ matrix.tag }})
        run: node scripts/build-sea.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: helmd-${{ matrix.tag }}
          path: dist/${{ matrix.tag }}/*
          if-no-files-found: error

  sign-and-release:
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    outputs:
      is_ga: ${{ steps.tag-kind.outputs.is_ga }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: helmd-*
          merge-multiple: false

      # download-artifact lands each matrix artifact under dist/helmd-<tag>/;
      # release-manifest.mjs expects dist/<tag>/. Flatten the prefix.
      - name: flatten artifact layout
        run: |
          for d in dist/helmd-*; do
            tag="${d#dist/helmd-}"
            mkdir -p "dist/$tag"
            mv "$d"/* "dist/$tag"/
            rmdir "$d"
          done
          ls -R dist

      - name: derive release version from tag
        run: echo "HELM_RELEASE_VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"

      # -rc tags stay GitHub prereleases and never publish to npm; only a
      # bare CalVer (YYYY.M.D) GA tag does both. publish-npm reads this job
      # output to decide whether to run at all.
      - name: classify tag (GA vs -rc)
        id: tag-kind
        run: |
          if [[ "$GITHUB_REF_NAME" == *-rc* ]]; then
            echo "is_ga=false" >> "$GITHUB_OUTPUT"
          else
            echo "is_ga=true" >> "$GITHUB_OUTPUT"
          fi

      - name: stamp package.json version from tag
        run: |
          node -e "
            const fs = require('node:fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = process.env.GITHUB_REF_NAME;
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: sign release manifest
        env:
          HELM_RELEASE_SIGNING_KEY_B64: ${{ secrets.HELM_RELEASE_SIGNING_KEY_B64 }}
        run: node scripts/release-manifest.mjs

      - name: verify release manifest (fail closed before publishing)
        run: node scripts/verify-release-manifest.mjs dist

      - name: generate packaging manifests
        run: node scripts/gen-packaging-manifests.mjs

      # Release assets share one flat namespace — three binaries all named
      # `helmd` collide (second upload 404s). Stage platform-suffixed copies.
      # The signed manifest's subject names stay `<platform>/<file>`; INSTALL.md
      # documents the rename mapping for manual verification.
      - name: stage release assets
        run: |
          mkdir -p dist/upload
          cp dist/linux-x64/helmd      dist/upload/helmd-linux-x64
          cp dist/macos-x64/helmd     dist/upload/helmd-macos-x64
          cp dist/macos-arm64/helmd   dist/upload/helmd-macos-arm64
          cp dist/windows-x64/helmd.exe dist/upload/helmd-windows-x64.exe
          cp dist/release-manifest.json dist/release-manifest.dsse.json dist/upload/

      # HELM-P3-D8: offline install path for environments that block the npm
      # registry (bank proxies, airgapped hosts) — `npm install
      # ./helm-cli-<version>.tgz` needs no registry reachability at all. Packed
      # from the SAME filled package gen-packaging-manifests.mjs just wrote
      # (real sha256 values baked in, no template placeholders), so it is
      # byte-identical to what publish-npm would publish. `npm pack` reads
      # package.json + files only — no install, no network.
      - name: pack offline npm tarball
        run: |
          TARBALL=$(cd dist/packaging/npm && npm pack --silent --pack-destination "$GITHUB_WORKSPACE/dist/upload")
          mv "dist/upload/$TARBALL" "dist/upload/helm-cli-${HELM_RELEASE_VERSION}.tgz"

      # D-SIGN-1 free hardening: a plain SHA256SUMS file gives anyone
      # `sha256sum -c` verification with zero tooling beyond coreutils,
      # alongside (not instead of) the DSSE-signed release-manifest above.
      # Runs after every asset staged so far (offline tarball incl.) so the
      # sums file covers this job's set. The SBOM lands separately via the
      # sbom/attach-sbom-asset jobs below (HELM-P4-F2-ACTION-FLAG)
      # and is not covered by this file — see F7 for closing that gap.
      - name: generate SHA256SUMS
        working-directory: dist/upload
        run: sha256sum * > SHA256SUMS

      # D-SIGN-1: GitHub-native SLSA build provenance for every release
      # asset. First-party action, no extra third-party-action review needed
      # (unlike sigstore/cosign-installer, which stays out per HELM-CODE-SIGNING-
      # RESEARCH-2026-07-23 §5). Verify with:
      #   gh attestation verify dist/upload/helmd-linux-x64 --repo PostOakLabs/ainumbers-helm
      - name: attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/upload/helmd-*\ndist/upload/helm-cli-*.tgz"

      - name: create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # RC tags (2026.7.25-rc1) stay --prerelease; GA CalVer tags self-promote to --latest.
          if [[ "${{ steps.tag-kind.outputs.is_ga }}" == "true" ]]; then
            PROMOTE_FLAG=--latest
          else
            PROMOTE_FLAG=--prerelease
          fi
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Helm $GITHUB_REF_NAME" \
            --generate-notes \
            "$PROMOTE_FLAG" \
            dist/upload/*

      # HELM-REL-AUTO-4: the filled npm package (package.json/bin/install.mjs
      # with real sha256 values, no template placeholders) lands here from
      # gen-packaging-manifests.mjs above. publish-npm downloads it rather
      # than regenerating, so what's published is byte-identical to what the
      # release manifest attested to.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-package
          path: dist/packaging/npm
          if-no-files-found: error

  # HELM-P4-F2-ACTION-FLAG: anchore/sbom-action moved OUT of
  # sign-and-release into its own job — contents:read only, no secrets, no
  # id-token, runs in parallel with signing off the same build artifacts.
  # This isolates the SBOM step so the only third-party Action in the release
  # pipeline never shares scope with HELM_RELEASE_SIGNING_KEY_B64 or OIDC.
  sbom:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # HELM-P4-C3: CycloneDX SBOM per release, published as a release asset
      # (docs/TRUST.md §5). anchore/sbom-action (syft-based) scans the
      # checked-out source tree — package.json + lockfile — for the full
      # dependency graph; no new devDependency, contents:read only, no
      # secrets touched. Pinned by commit SHA (v0.24.0): a tag can be
      # repointed by its author, a commit hash cannot.
      - name: generate CycloneDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom.cyclonedx.json
          if-no-files-found: error

  # Attaches the SBOM built in the isolated `sbom` job to the GitHub release
  # `sign-and-release` already created. contents:write to call `gh release
  # upload`, and nothing else — no signing secret, no id-token, no npm step.
  attach-sbom-asset:
    needs: [sign-and-release, sbom]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom
          path: sbom-dl
      - name: upload SBOM to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" sbom-dl/sbom.cyclonedx.json --repo "$GITHUB_REPOSITORY"

  # HELM-REGISTRY-LIST-1: the Official MCP Registry listing (server.json at
  # the repo root) points its packages[] entry at
  # .../releases/download/<version>/helm-<version>.mcpb, so a release is not
  # complete until that bundle is attached to it. The bundle is the
  # deterministic store-only zip scripts/build-mcpb.mjs produces
  # (HELM-MCPB-1: same tree in, same bytes out, byte-identity test-covered),
  # built here from the TAG's tree so the published asset is byte-identical
  # to what server.json's fileSha256 pins.
  #
  # Own job, not a step in sign-and-release — the same isolation shape as
  # the SBOM job above: no signing key, no OIDC, no npm; only the
  # already-pinned first-party actions + `run:` + the preinstalled gh CLI.
  #
  # Modes:
  #   tag push            — build from the pushed tag, upload to the new
  #                         release (after sign-and-release created it).
  #   dispatch, dry_run=true (default) — build from the `tag` input's tree,
  #                         print the sha256, upload NOTHING. The pre-merge
  #                         exercise surface for this step (SO #40): the
  #                         printed digest must equal server.json's pinned
  #                         fileSha256.
  #   dispatch, dry_run=false + tag — BACKFILL: attach the bundle to an
  #                         existing release that predates this job
  #                         (--clobber makes re-runs idempotent).
  mcpb:
    needs: [sign-and-release]
    # On a dispatch, sign-and-release is skipped — skipped != failure, so
    # !failure() (not success()) is what lets this job run there.
    if: ${{ !failure() && !cancelled() && (github.event_name == 'push' || inputs.tag != '') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Backfill dispatch checks out the NAMED tag's tree; a tag push
          # checks out the pushed tag itself (inputs.tag is null there, and
          # null != '' is false under GitHub expression coercion, so the
          # expression falls through to the triggering ref).
          ref: ${{ inputs.tag != '' && inputs.tag || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: derive bundle version
        env:
          MCPB_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$MCPB_TAG" ]; then
            echo "HELM_MCPB_VERSION=$MCPB_TAG" >> "$GITHUB_ENV"
          else
            echo "HELM_MCPB_VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          fi
      # Same stamp the build/sign jobs do: the bundle's manifest version is
      # injected from package.json by build-mcpb.mjs — one source of truth,
      # never retyped.
      - name: stamp package.json version
        run: |
          node -e "
            const fs = require('node:fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = process.env.HELM_MCPB_VERSION;
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "
      - name: build .mcpb bundle (deterministic, store-only)
        run: node scripts/build-mcpb.mjs
      # The digest server.json's packages[mcpb].fileSha256 must pin —
      # restated loudly so a dry-run log doubles as the verification
      # surface for that pin.
      - name: report bundle digest
        run: |
          sha256sum "dist/helm-${HELM_MCPB_VERSION}.mcpb"
          echo "server.json packages[mcpb].fileSha256 for ${HELM_MCPB_VERSION} must be the sha256 above"
      - name: upload bundle to the release
        # dry_run defaults true, so a manual dispatch uploads nothing by
        # default; on a tag push the inputs context is empty and this runs.
        if: ${{ inputs.dry_run != true }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$HELM_MCPB_VERSION" \
            "dist/helm-${HELM_MCPB_VERSION}.mcpb" \
            --repo "$GITHUB_REPOSITORY" --clobber

  # HELM-REL-NPM-DEFER: ainumbers-helm is unregistered on npm and npm only
  # lets you attach a trusted publisher from an EXISTING package's settings
  # page, so there is no way to configure OIDC trusted publishing before a
  # first manual bootstrap publish. Deferring npm distribution until then —
  # the signed GitHub release stands alone for GA. Gate this
  # job behind an explicit opt-in var (default unset/false) so it SKIPS
  # cleanly instead of red-failing the first GA tag. Revive trigger: once
  # the npm trusted publisher is attached (requires the package to exist
  # first), flip vars.NPM_PUBLISH_ENABLED to 'true' in repo settings — no
  # other change needed, the OIDC wiring below stays intact.
  publish-npm:
    needs: sign-and-release
    if: needs.sign-and-release.outputs.is_ga == 'true' && vars.NPM_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package
          path: npm-package
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # OIDC trusted publishing needs npm CLI >=11.5.1; setup-node's bundled
      # CLI lags behind, so pin to an explicit version before publishing
      # (not `@latest` — a floating tag can drift the exact toolchain used
      # to publish out from under this pinned workflow).
      - name: update npm CLI for OIDC trusted publishing
        run: npm install -g npm@11.5.1

      - name: publish to npm (OIDC provenance, no token)
        working-directory: npm-package
        run: npm publish --access public --provenance

  # HELM-P4-F3-VERSIONFEED: helm/version.json in the SITE repo
  # (ainumbers.co/helm/version.json) is the machine-readable release feed
  # docs/RELEASE-CHANNEL.md §3 promises a CAB, and what helmd's own
  # version-check (hub/version-check.mjs) polls. Generated here, on every
  # GA tag, so no human hand-edits it — a hand-maintained feed is exactly
  # the unattended-duty class HELM-PHASE4-BUILD-SPEC.md §4 gate 5 rules
  # out. Facts only (version numbers, a real timestamp, a release URL) —
  # no day-based or support-window language belongs in this file.
  publish-version-feed:
    needs: sign-and-release
    if: needs.sign-and-release.outputs.is_ga == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # WHY AN APP TOKEN AND NOT A PAT (measured 2026-08-16): the site repo
      # `main` is governed by ruleset `main-ci-anchor`, which requires the
      # `anchor` check on every push. A PAT push acts as the USER who issued
      # it, and a user can never be a ruleset bypass actor — so this job
      # failed with `GH013 … Required status check "anchor" is expected` on
      # 2026.8.12 / .13 / .14 and the CAB feed froze at 2026.8.11. Only an
      # org-installed GitHub App can be a bypass actor. Same app, same
      # secrets, same pinned action as auto-tag-release.yml: one bot, one
      # story. SITE_REPO_PUSH_TOKEN is retired here — no dead PAT path is
      # left standing beside the live App path.
      - name: mint release-bot installation token (scoped to the site repo only)
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          owner: PostOakLabs
          repositories: ainumbers
          permission-contents: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: helm
      # `persist-credentials: false` keeps the App token out of the checkout's
      # stored git credential (zizmor `artipacked`); it is supplied explicitly
      # at push time instead, via env, in the last step.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: PostOakLabs/ainumbers
          token: ${{ steps.app-token.outputs.token }}
          path: site
          persist-credentials: false

      - name: write version.json
        run: |
          VERSION="${GITHUB_REF_NAME}"
          PUBLISHED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          node helm/scripts/gen-version-feed.mjs \
            --version "$VERSION" \
            --published-at "$PUBLISHED_AT" \
            --release-url "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME}" \
            --schema helm/schema/version_notice.schema.json \
            --out site/helm/version.json

      # Run the guide-freshness generator in WRITE mode here so a GA release
      # never leaves the site repo owing a human-run sync. Scoped tolerance,
      # not a job-level one: gen-helm-guide-freshness.mjs exits 1 whenever the
      # walkthrough is byte-identical to the last synced release (evaluate()
      # L69-78) — that is the gate correctly deferring to a human judgment
      # call (the site repo's acknowledged_no_change escape), NOT a failure
      # of this job. version.json must still publish in that case, so only
      # this step is allowed to fail without failing the job; every other
      # step keeps failing normally.
      - name: sync helm guide-freshness (non-fatal — see comment)
        id: guide_freshness
        working-directory: site
        continue-on-error: true
        run: node scripts/gen-helm-guide-freshness.mjs

      - name: report guide-freshness sync outcome
        run: |
          if [ "${{ steps.guide_freshness.outcome }}" != "success" ]; then
            echo "::warning::gen-helm-guide-freshness.mjs exited non-zero for ${GITHUB_REF_NAME} — likely a byte-identical walkthrough needing a human acknowledged_no_change entry in the site repo. version.json will still publish; the freshness snapshot stays unsynced until a human judges it."
          fi

      - name: commit + push (no-op if unchanged)
        working-directory: site
        env:
          # Via env, never inlined into the script: an expression interpolated
          # into `run:` is substituted as literal text before the shell sees
          # it, which both leaks the credential into the command line and
          # makes it shell-evaluable.
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git config user.name "helm-release-bot"
          git config user.email "noreply@postoaklabs.com"
          if git diff --quiet -- helm/version.json helm/guide-freshness.json; then
            echo "version.json and guide-freshness.json unchanged, nothing to push"
            exit 0
          fi
          git add helm/version.json helm/guide-freshness.json
          git commit -m "chore(helm): publish version.json for ${GITHUB_REF_NAME}"
          # The checkout ran with persist-credentials:false, so supply the App
          # token here, at push time only. App-authored ⇒ the ruleset bypass
          # actor applies and `anchor` no longer blocks the push.
          git remote set-url origin "https://x-access-token:${APP_TOKEN}@github.com/PostOakLabs/ainumbers.git"
          git push origin HEAD:main
