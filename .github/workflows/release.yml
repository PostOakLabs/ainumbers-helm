name: Release

# HELM-H8: tag-triggered three-platform SEA build + signed release manifest
# + packaging manifests, published as a GitHub pre-release. Never runs on
# push to main — only on an explicit CalVer tag, so cutting a release is a
# deliberate act (git tag + push), not a side effect of merging.
#
# HELM-CALVER-1: version IS the ship date — YYYY.M.D, no zero-padding, no
# `v` prefix (Tim, 2026-07-25: "the tagging system is dumb ... it's
# arbitrary"). Tag with: git tag 2026.7.25 && git push --tags.
on:
  push:
    tags:
      - "20[0-9][0-9].*"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
      - name: lint
        run: node scripts/lint.mjs
      # Install a real Secret Service so the linux-secret-tool vault tier is
      # genuinely reachable in CI, not just warned about. Without this the
      # ubuntu runner has no Secret Service daemon, vaultSet's
      # linux-secret-tool attempt throws, and every secret silently lands on
      # the file-fallback tier instead.
      - name: install Secret Service (libsecret + gnome-keyring) for real linux-secret-tool coverage
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gnome-keyring libsecret-tools dbus-x11
      # Env vars land in $GITHUB_ENV (not just this step's shell) so the plain
      # `node scripts/test.mjs` invocation below stays a single literal line —
      # check-hook-ci-parity.mjs greps exactly that shape, and burying it
      # inside a `bash -c '...'` wrapper would make this gate invisible to it.
      - name: start + unlock a Secret Service session (dbus + gnome-keyring)
        run: |
          eval "$(dbus-launch --sh-syntax)"
          echo "DBUS_SESSION_BUS_ADDRESS=$DBUS_SESSION_BUS_ADDRESS" >> "$GITHUB_ENV"
          eval "$(printf '\n' | gnome-keyring-daemon --unlock --components=secrets)"
          echo "GNOME_KEYRING_CONTROL=$GNOME_KEYRING_CONTROL" >> "$GITHUB_ENV"
      - name: test
        run: node scripts/test.mjs
      - name: validate control-plane schemas
        run: node scripts/validate-schemas.mjs
      - name: sea build dry-run
        run: node scripts/sea-dry-run.mjs

  build:
    needs: test
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            tag: linux-x64
          - os: windows-latest
            tag: windows-x64
          # macos-13 (Intel) was retired by GitHub 2025-12-04; macos-15-intel
          # is the current Intel image (supported through Aug 2027).
          - os: macos-15-intel
            tag: macos-x64
          - os: macos-14
            tag: macos-arm64
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
      - name: build SEA binary (${{ matrix.tag }})
        run: node scripts/build-sea.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: helmd-${{ matrix.tag }}
          path: dist/${{ matrix.tag }}/*
          if-no-files-found: error

  sign-and-release:
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    outputs:
      is_ga: ${{ steps.tag-kind.outputs.is_ga }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          path: dist
          pattern: helmd-*
          merge-multiple: false

      # download-artifact lands each matrix artifact under dist/helmd-<tag>/;
      # release-manifest.mjs expects dist/<tag>/. Flatten the prefix.
      - name: flatten artifact layout
        run: |
          for d in dist/helmd-*; do
            tag="${d#dist/helmd-}"
            mkdir -p "dist/$tag"
            mv "$d"/* "dist/$tag"/
            rmdir "$d"
          done
          ls -R dist

      # dist/ now holds a real assembled binary for this runner's platform
      # (linux-x64) — the only place in either workflow
      # where a just-built binary and the tree it was vendored from are both
      # present at once. Compares the binary's embedded kernel pins against
      # packs/*.json and WARNs (never fails) on drift; see the script header
      # for why FAIL would be wrong here.
      - name: kernel pin drift (shipped binary vs tree)
        run: node scripts/check-dist-pin-drift.mjs

      - name: derive release version from tag
        run: echo "HELM_RELEASE_VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"

      # -rc tags stay GitHub prereleases and never publish to npm; only a
      # bare CalVer (YYYY.M.D) GA tag does both. publish-npm reads this job
      # output to decide whether to run at all.
      - name: classify tag (GA vs -rc)
        id: tag-kind
        run: |
          if [[ "$GITHUB_REF_NAME" == *-rc* ]]; then
            echo "is_ga=false" >> "$GITHUB_OUTPUT"
          else
            echo "is_ga=true" >> "$GITHUB_OUTPUT"
          fi

      - name: sign release manifest
        env:
          HELM_RELEASE_SIGNING_KEY_B64: ${{ secrets.HELM_RELEASE_SIGNING_KEY_B64 }}
        run: node scripts/release-manifest.mjs

      - name: verify release manifest (fail closed before publishing)
        run: node scripts/verify-release-manifest.mjs dist

      - name: generate packaging manifests
        run: node scripts/gen-packaging-manifests.mjs

      # Release assets share one flat namespace — three binaries all named
      # `helmd` collide (second upload 404s). Stage platform-suffixed copies.
      # The signed manifest's subject names stay `<platform>/<file>`; INSTALL.md
      # documents the rename mapping for manual verification.
      - name: stage release assets
        run: |
          mkdir -p dist/upload
          cp dist/linux-x64/helmd      dist/upload/helmd-linux-x64
          cp dist/macos-x64/helmd     dist/upload/helmd-macos-x64
          cp dist/macos-arm64/helmd   dist/upload/helmd-macos-arm64
          cp dist/windows-x64/helmd.exe dist/upload/helmd-windows-x64.exe
          cp dist/release-manifest.json dist/release-manifest.dsse.json dist/upload/

      # HELM-P3-D8: offline install path for environments that block the npm
      # registry (bank proxies, airgapped hosts) — `npm install
      # ./helm-cli-<version>.tgz` needs no registry reachability at all. Packed
      # from the SAME filled package gen-packaging-manifests.mjs just wrote
      # (real sha256 values baked in, no template placeholders), so it is
      # byte-identical to what publish-npm would publish. `npm pack` reads
      # package.json + files only — no install, no network.
      - name: pack offline npm tarball
        run: |
          TARBALL=$(cd dist/packaging/npm && npm pack --silent --pack-destination "$GITHUB_WORKSPACE/dist/upload")
          mv "dist/upload/$TARBALL" "dist/upload/helm-cli-${HELM_RELEASE_VERSION}.tgz"

      # D-SIGN-1 free hardening: a plain SHA256SUMS file gives anyone
      # `sha256sum -c` verification with zero tooling beyond coreutils,
      # alongside (not instead of) the DSSE-signed release-manifest above.
      # Runs after every asset staged so far (offline tarball incl.) so the
      # sums file covers this job's set. The SBOM lands separately via the
      # sbom/attach-sbom-asset jobs below (HELM-P4-F2-ACTION-FLAG)
      # and is not covered by this file — see F7 for closing that gap.
      - name: generate SHA256SUMS
        working-directory: dist/upload
        run: sha256sum * > SHA256SUMS

      # D-SIGN-1: GitHub-native SLSA build provenance for every release
      # asset. First-party action, no extra third-party-action review needed
      # (unlike sigstore/cosign-installer, which stays out per HELM-CODE-SIGNING-
      # RESEARCH-2026-07-23 §5). Verify with:
      #   gh attestation verify dist/upload/helmd-linux-x64 --repo PostOakLabs/ainumbers-helm
      - name: attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: "dist/upload/helmd-*\ndist/upload/helm-cli-*.tgz"

      - name: create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # RC tags (2026.7.25-rc1) stay --prerelease; GA CalVer tags self-promote to --latest.
          if [[ "${{ steps.tag-kind.outputs.is_ga }}" == "true" ]]; then
            PROMOTE_FLAG=--latest
          else
            PROMOTE_FLAG=--prerelease
          fi
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Helm $GITHUB_REF_NAME" \
            --generate-notes \
            "$PROMOTE_FLAG" \
            dist/upload/*

      # HELM-REL-AUTO-4: the filled npm package (package.json/bin/install.mjs
      # with real sha256 values, no template placeholders) lands here from
      # gen-packaging-manifests.mjs above. publish-npm downloads it rather
      # than regenerating, so what's published is byte-identical to what the
      # release manifest attested to.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-package
          path: dist/packaging/npm
          if-no-files-found: error

  # HELM-P4-F2-ACTION-FLAG: anchore/sbom-action moved OUT of
  # sign-and-release into its own job — contents:read only, no secrets, no
  # id-token, runs in parallel with signing off the same build artifacts.
  # This isolates the SBOM step so the only third-party Action in the release
  # pipeline never shares scope with HELM_RELEASE_SIGNING_KEY_B64 or OIDC.
  sbom:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # HELM-P4-C3: CycloneDX SBOM per release, published as a release asset
      # (docs/TRUST.md §5). anchore/sbom-action (syft-based) scans the
      # checked-out source tree — package.json + lockfile — for the full
      # dependency graph; no new devDependency, contents:read only, no
      # secrets touched. Pinned by commit SHA (v0.24.0): a tag can be
      # repointed by its author, a commit hash cannot.
      - name: generate CycloneDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom
          path: sbom.cyclonedx.json
          if-no-files-found: error

  # Attaches the SBOM built in the isolated `sbom` job to the GitHub release
  # `sign-and-release` already created. contents:write to call `gh release
  # upload`, and nothing else — no signing secret, no id-token, no npm step.
  attach-sbom-asset:
    needs: [sign-and-release, sbom]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: sbom
          path: sbom-dl
      - name: upload SBOM to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" sbom-dl/sbom.cyclonedx.json --repo "$GITHUB_REPOSITORY"

  # HELM-REL-NPM-DEFER: ainumbers-helm is unregistered on npm and npm only
  # lets you attach a trusted publisher from an EXISTING package's settings
  # page, so there is no way to configure OIDC trusted publishing before a
  # first manual bootstrap publish. Deferring npm distribution until then —
  # the signed GitHub release stands alone for GA. Gate this
  # job behind an explicit opt-in var (default unset/false) so it SKIPS
  # cleanly instead of red-failing the first GA tag. Revive trigger: once
  # the npm trusted publisher is attached (requires the package to exist
  # first), flip vars.NPM_PUBLISH_ENABLED to 'true' in repo settings — no
  # other change needed, the OIDC wiring below stays intact.
  publish-npm:
    needs: sign-and-release
    if: needs.sign-and-release.outputs.is_ga == 'true' && vars.NPM_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: npm-package
          path: npm-package
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # OIDC trusted publishing needs npm CLI >=11.5.1; setup-node's bundled
      # CLI lags behind, so pin to an explicit version before publishing
      # (not `@latest` — a floating tag can drift the exact toolchain used
      # to publish out from under this pinned workflow).
      - name: update npm CLI for OIDC trusted publishing
        run: npm install -g npm@11.5.1

      - name: publish to npm (OIDC provenance, no token)
        working-directory: npm-package
        run: npm publish --access public --provenance

  # HELM-P4-F3-VERSIONFEED: helm/version.json in the SITE repo
  # (ainumbers.co/helm/version.json) is the machine-readable release feed
  # docs/RELEASE-CHANNEL.md §3 promises a CAB, and what helmd's own
  # version-check (hub/version-check.mjs) polls. Generated here, on every
  # GA tag, so no human hand-edits it — a hand-maintained feed is exactly
  # the unattended-duty class HELM-PHASE4-BUILD-SPEC.md §4 gate 5 rules
  # out. Facts only (version numbers, a real timestamp, a release URL) —
  # no day-based or support-window language belongs in this file.
  publish-version-feed:
    needs: sign-and-release
    if: needs.sign-and-release.outputs.is_ga == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Without this secret, actions/checkout below falls
      # back to no auth token, checks out the (public) site repo fine, and
      # the eventual `git push` 403s — a real failure, but one buried at
      # the bottom of the log under a generic auth error. Fail here instead,
      # first, with a message that names the actual cause: helm.html will
      # keep serving a stale version until this secret exists.
      - name: verify SITE_REPO_PUSH_TOKEN is configured
        env:
          TOKEN_SET: ${{ secrets.SITE_REPO_PUSH_TOKEN != '' }}
        run: |
          if [ "$TOKEN_SET" != "true" ]; then
            echo "::error::SITE_REPO_PUSH_TOKEN secret is not set — publish-version-feed cannot push helm/version.json to the site repo, so helm.html will keep serving a stale version. This must be added (fine-grained PAT, contents:write, scoped to PostOakLabs/ainumbers only) before this job can succeed."
            exit 1
          fi

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: helm
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: PostOakLabs/ainumbers
          token: ${{ secrets.SITE_REPO_PUSH_TOKEN }}
          path: site

      - name: write version.json
        run: |
          VERSION="${GITHUB_REF_NAME}"
          PUBLISHED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          node helm/scripts/gen-version-feed.mjs \
            --version "$VERSION" \
            --published-at "$PUBLISHED_AT" \
            --release-url "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME}" \
            --schema helm/schema/version_notice.schema.json \
            --out site/helm/version.json

      - name: commit + push (no-op if unchanged)
        working-directory: site
        run: |
          git config user.name "helm-release-bot"
          git config user.email "noreply@postoaklabs.com"
          if git diff --quiet -- helm/version.json; then
            echo "version.json unchanged, nothing to push"
            exit 0
          fi
          git add helm/version.json
          git commit -m "chore(helm): publish version.json for ${GITHUB_REF_NAME}"
          git push origin HEAD:main
