name: Auto-tag release

# Takes the recurring "cut a release" duty off a human. Runs daily; if
# `main` has moved since the last GA CalVer tag, bumps
# `package.json` to today's date, regenerates docs/openapi.json (its own
# freshness gate would otherwise fail), commits both, and pushes today's
# YYYY.M.D tag — which is what actually fires release.yml. No-op (exit 0,
# no commit, no tag) if nothing changed since the last tag, or if a tag for
# today already exists: one release per day is a hard CalVer constraint,
# not a preference — the date consumes all three semver components, so two
# GA tags on the same day can never both exist. `workflow_dispatch` lets
# this be forced manually (e.g. to verify the pipeline without waiting for
# the schedule).
#
# The tag push MUST be authored by a GitHub App
# installation token, never the default GITHUB_TOKEN. GitHub documents that
# "events triggered by the GITHUB_TOKEN will not create a new workflow run",
# so a GITHUB_TOKEN-authored `git push origin <tag>` pushes a real tag that
# release.yml's `on: push: tags:` never sees. Not hypothetical: that is what
# silently happened to 2026.7.26/.27/.28/.30 while auto-tag's own run stayed
# green every day. The App (`postoaklabs-helm-release-bot`, org-owned,
# Contents: read+write only, installed on this repo only) is a DIFFERENT
# actor, so its pushes do fire tag-triggered workflows.
on:
  schedule:
    - cron: "0 14 * * *" # once daily; the if-changed gate makes idle days a no-op
  workflow_dispatch:
    inputs:
      tag_override:
        description: >-
          Verification only. Tag to push instead of today's CalVer date.
          MUST carry an -rc suffix: the date IS the version, so tagging a
          bare YYYY.M.D by hand would consume that day's only GA slot. An
          -rc run pushes the tag and nothing else — no version bump, no
          commit to main (release.yml derives the release version from the
          tag ref, and treats -rc as a prerelease).
        required: false
        default: ""

permissions:
  contents: read

jobs:
  tag-if-changed:
    runs-on: ubuntu-latest
    permissions:
      # The default GITHUB_TOKEN deliberately keeps NO write scope here: it
      # must never be the credential that pushes the tag (see header). All
      # writes go through the App installation token minted below.
      contents: read
    steps:
      # Fail loudly and specifically when the App secrets are absent, rather
      # than letting the token step fail with a generic error — and never
      # fall back to GITHUB_TOKEN, which would silently restore the exact
      # defect this workflow exists to avoid.
      - name: require release-bot secrets
        env:
          APP_ID: ${{ secrets.RELEASE_BOT_APP_ID }}
          PRIVATE_KEY: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
        run: |
          set -e
          missing=""
          [ -n "$APP_ID" ] || missing="$missing RELEASE_BOT_APP_ID"
          [ -n "$PRIVATE_KEY" ] || missing="$missing RELEASE_BOT_PRIVATE_KEY"
          if [ -n "$missing" ]; then
            echo "missing required secret(s):$missing" >&2
            echo "the tag push must be App-authored; there is no GITHUB_TOKEN fallback." >&2
            exit 1
          fi

      # Pinned to a commit SHA, not a floating tag — the house rule already
      # stated in release.yml, and it binds harder here because this action
      # MINTS A CREDENTIAL.
      - name: mint release-bot installation token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          ref: main
          # Persisting the App token as the git credential is what makes the
          # commit AND the tag push App-authored, so release.yml fires.
          token: ${{ steps.app-token.outputs.token }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"

      - name: decide whether to release
        id: gate
        env:
          # Via env, never inlined into the script: a dispatch input is
          # attacker-controllable text and must not be evaluated as shell.
          TAG_OVERRIDE: ${{ inputs.tag_override }}
        run: |
          set -e

          # Verification path: push one explicitly-named -rc tag, bump
          # nothing. This is what makes `workflow_dispatch` able to exercise
          # the pipeline end-to-end; the normal same-day guard below would
          # otherwise make a manual run a no-op on any day already tagged.
          if [ -n "$TAG_OVERRIDE" ]; then
            case "$TAG_OVERRIDE" in
              *-rc*) ;;
              *)
                echo "tag_override must carry an -rc suffix — a bare CalVer date is only ever cut by the daily schedule." >&2
                exit 1
                ;;
            esac
            echo "tag=$TAG_OVERRIDE" >> "$GITHUB_OUTPUT"
            echo "bump=false" >> "$GITHUB_OUTPUT"
            if git rev-parse -q --verify "refs/tags/$TAG_OVERRIDE" >/dev/null; then
              echo "already tagged $TAG_OVERRIDE — a tag is a published fact, not re-pointing it."
              echo "skip=true" >> "$GITHUB_OUTPUT"
            else
              echo "pushing verification tag $TAG_OVERRIDE."
              echo "skip=false" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          TAG="$(date -u +%Y.%-m.%-d)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "bump=true" >> "$GITHUB_OUTPUT"

          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "already tagged $TAG — one release per day, skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # nearest GA CalVer tag reachable from HEAD (excludes -rc and the
          # old v0.1.0 semver tag via the match pattern)
          LATEST_TAG="$(git describe --tags --abbrev=0 --match '20[0-9][0-9].*' HEAD 2>/dev/null || true)"
          if [ -z "$LATEST_TAG" ]; then
            echo "no prior CalVer GA tag found — proceeding."
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          LATEST_COMMIT="$(git rev-list -n1 "$LATEST_TAG")"
          HEAD_COMMIT="$(git rev-parse HEAD)"
          if [ "$LATEST_COMMIT" = "$HEAD_COMMIT" ]; then
            echo "main unchanged since $LATEST_TAG — nothing to release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "main has moved since $LATEST_TAG — releasing $TAG."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # Folds the version bump into the same step that computes the tag
      # (Tim's ruling, docs/RELEASING.md) so the two can never drift apart
      # the way they did on the first CalVer release. package.json has four
      # consumers (release-manifest's signing guard, DAEMON_VERSION baked
      # into the SEA binaries, doctor's version-check, docs/openapi.json's
      # own freshness gate) and this is the one place that updates it.
      - name: bump version, regen openapi, commit, tag, push
        if: steps.gate.outputs.skip != 'true'
        env:
          # Via env, never `${{ }}` inside the run: body. GitHub expands a
          # template into the SCRIPT TEXT before any shell parses it, so an
          # expansion is code, not data. Both values here are derived from
          # `inputs.tag_override` on the workflow_dispatch path — the -rc check
          # in the gate step is a glob (`*-rc*`), which a payload like
          # `-rc$(...)` satisfies — so the chain from a dispatch input to
          # executed shell was real. It was NOT fork-reachable (schedule and
          # workflow_dispatch only, both requiring repo write), so this is
          # hygiene rather than an exposed vulnerability; that is exactly why
          # the same expansion is worth removing while it is still cheap.
          TAG: ${{ steps.gate.outputs.tag }}
          BUMP: ${{ steps.gate.outputs.bump }}
        run: |
          set -e

          git config user.name "helm-release-bot"
          git config user.email "noreply@postoaklabs.com"

          # An -rc verification tag bumps nothing: release.yml reads the
          # release version off the tag ref, so moving main's version for a
          # throwaway tag would be a lie in package.json's four consumers.
          if [ "$BUMP" = "true" ]; then
            # $TAG is read from the environment inside node, never spliced into
            # the JS source text: a shell-quoted '$TAG' in a `node -e` string is
            # a second injection sink of the same shape, one layer down.
            node --input-type=module -e "
              import { readFileSync, writeFileSync } from 'node:fs';
              const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
              pkg.version = process.env.TAG;
              writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
            "
            node scripts/gen-openapi.mjs

            git add package.json docs/openapi.json
            git commit -m "release(helm): bump version to $TAG"
            git push origin HEAD:main
          fi

          git tag "$TAG"
          git push origin "$TAG"
